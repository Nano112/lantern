[package]
name = "lantern-wasi"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0"

[[bin]]
name = "lantern"
path = "src/main.rs"

[dependencies]
pumpkin = { path = "../../pumpkin/pumpkin" }
pumpkin-config = { path = "../../pumpkin/pumpkin-config" }
pumpkin-util = { path = "../../pumpkin/pumpkin-util" }
pumpkin-world = { path = "../../pumpkin/pumpkin-world" }
pumpkin-data = { path = "../../pumpkin/pumpkin-data" }
pumpkin-protocol = { path = "../../pumpkin/pumpkin-protocol" }
# Schem-at/Nucleation — schematic parsing (and later: SDF, OSM, redstone sim)
nucleation = { path = "/Users/harrison/code/nucleation", default-features = false }
mc-tick = { path = "/Users/harrison/code/nucleation/crates/mc-tick" }
tokio = { version = "1.53", default-features = false, features = ["macros", "rt"] }
tracing = { version = "0.1", default-features = false, features = ["std"] }
wasi = "0.11"
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
serde_json = "1"
