[workspace]
resolver = "3"
members = ["crates/lantern-web", "crates/lantern-wasi", "crates/schem-gen"]
# The pumpkin submodule is its own workspace; path deps reach into it.
exclude = ["pumpkin"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

# parking_lot_core picks a panicking thread parker on wasm unless its wasm
# atomics parker is enabled, which upstream still gates behind a nightly
# feature even though the intrinsics are stable. Vendored with the gate lifted.
[patch.crates-io]
parking_lot_core = { path = "vendor/parking_lot_core" }
