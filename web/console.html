<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>lantern console — Pumpkin server in your browser</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; height: 100vh; display: flex; flex-direction: column;
         background: #16130f; color: #e8dcc8; font: 13px/1.45 ui-monospace, Menlo, monospace; }
  header { display: flex; gap: 1rem; align-items: baseline; padding: 10px 16px; border-bottom: 1px solid #2c2620; }
  h1 { font-size: 15px; margin: 0; color: #f0a030; }
  #status { color: #9a8f7a; }
  #log { flex: 1; overflow-y: auto; padding: 10px 16px; white-space: pre-wrap; word-break: break-all; }
  #inputbar { display: flex; border-top: 1px solid #2c2620; }
  #prompt { padding: 10px 0 10px 16px; color: #f0a030; }
  #input { flex: 1; background: transparent; border: 0; outline: none; color: inherit;
           font: inherit; padding: 10px 16px 10px 8px; }
</style>
</head>
<body>
<header><h1>🎃 lantern console</h1><div id="status">booting…</div></header>
<div id="log"></div>
<div id="inputbar"><span id="prompt">$</span><input id="input" autocomplete="off" spellcheck="false" autofocus placeholder="server command (help, seed, say hi, time query daytime)"></div>
<script type="module" src="./dist/console-main.js"></script>
</body>
</html>
